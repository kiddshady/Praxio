<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Una app con historias
     clínicas adentro no tiene ningún motivo para hablar con la red. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Praxio</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/hoja.css">
<link rel="stylesheet" href="./css/rx.css">
<link rel="stylesheet" href="./css/quirotech.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #070b0b;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  /* La marca AFLORA (la firma de movimiento de Opal): sube apenas y se
     enciende, con la sombra larga de lo que flota. */
  #boot-splash img {
    width: 84px;
    height: 84px;
    opacity: 0;
    transform: translateY(8px) scale(.97);
    filter: drop-shadow(0 14px 30px rgb(0 0 0 / .6));
    animation: boot-aflora .7s cubic-bezier(.16, 1, .3, 1) .05s forwards;
  }
  @keyframes boot-aflora { to { opacity: 1; transform: none; } }
</style>

<div id="boot-splash">
  <img src="./img/marca.png" alt="">
</div>

<div class="op-app">

  <!-- El sustrato: niebla y papel de electro (quirotech.css). Una capa, estática. -->
  <div class="op-fog" aria-hidden="true"></div>

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="op-titlebar">
    <div class="op-brand op-no-drag" id="brand">
      <img class="op-brand__img" src="./img/marca-chica.png" srcset="./img/marca-chica.png 1x, ./img/marca-chica@2x.png 2x" alt="">
      <span class="op-brand__name">Praxio</span>
    </div>

    <!-- Contexto de la vista actual. Lo llena el router. -->
    <div class="op-titlebar__context" id="titlebar-context"></div>
  </header>

  <!-- Los controles de ventana viven aparte de la titlebar (Opal). -->
  <div class="op-wincontrols">
    <button class="op-wincontrol" id="win-min"   aria-label="Minimize"><i data-icon="winMin"></i></button>
    <button class="op-wincontrol op-iconswap" id="win-max" aria-label="Maximize"><i data-icon="winMax"></i><i data-icon="winRestore"></i></button>
    <button class="op-wincontrol op-wincontrol--close" id="win-close" aria-label="Close"><i data-icon="winClose"></i></button>
  </div>

  <div class="op-body">

    <!-- ── Rail ──────────────────────────────────────────────────────────── -->
    <nav class="op-rail">
      <div class="op-rail__top">
        <button class="op-btn op-btn--primary op-flashable" id="btn-nueva-receta" style="width:100%">
          <i data-icon="plus"></i> New prescription
        </button>
      </div>

      <div class="op-rail__nav op-scroll">
        <div class="op-rail__group">
          <button class="op-navitem" data-view="tablero">
            <i data-icon="home"></i> Dashboard
          </button>
          <button class="op-navitem" data-view="pacientes">
            <i data-icon="users"></i> Patients <span class="op-navitem__count" id="cuenta-pacientes"></span>
          </button>
          <button class="op-navitem" data-view="recetas">
            <i data-icon="file"></i> Prescriptions <span class="op-navitem__count" id="cuenta-recetas"></span>
          </button>
          <button class="op-navitem" data-view="ordenes">
            <i data-icon="orden"></i> Test orders <span class="op-navitem__count" id="cuenta-ordenes"></span>
          </button>
        </div>

        <div class="op-rail__group">
          <div class="op-rail__group-label">Catalog</div>
          <button class="op-navitem" data-view="medicamentos">
            <i data-icon="pill"></i> Medications
          </button>
          <button class="op-navitem" data-view="estudios">
            <i data-icon="estudio"></i> Tests
          </button>
        </div>

        <div class="op-rail__group">
          <div class="op-rail__group-label">System</div>
          <button class="op-navitem" data-view="ajustes">
            <i data-icon="settings"></i> Settings
          </button>
        </div>
      </div>

      <div class="op-rail__foot" id="rail-foot">
        <button class="op-btn op-btn--ghost op-flashable" id="btn-bloquear" style="width:100%"
                data-tip="Closes the database and asks for the password" data-tip-side="top">
          <i data-icon="lock"></i> Lock
        </button>
      </div>
    </nav>

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="op-main" id="view"></main>

    <!-- ── Panel derecho: la filiación del paciente en su ficha (.con-panel) ── -->
    <aside class="op-panel" id="panel" aria-label="Patient details" inert></aside>
  </div>

  <!-- ── Statusbar ───────────────────────────────────────────────────────── -->
  <footer class="op-statusbar">
    <div class="op-statusbar__item" data-tip="Prescriptions issued today" data-tip-side="top">
      <i data-icon="file"></i> <span class="op-statusbar__value op-num" id="stat-hoy"></span> today
    </div>
    <div class="op-statusbar__item" id="stat-cifrado" data-tip="The database is encrypted on disk" data-tip-side="top">
      <i data-icon="lock"></i> <span class="op-statusbar__value">Encrypted</span>
    </div>
    <button type="button" class="op-statusbar__item op-plegable--ancho rx-update" id="stat-update"
            data-tip-side="top" hidden></button>
    <div class="op-spacer"></div>
  </footer>
</div>

<!-- ── Cerradura ──────────────────────────────────────────────────────────────
     Tapa la app entera mientras la base está cerrada. No es decorativa: el
     proceso principal rechaza todo pedido de dominio si la base no está
     abierta, así que esto es lo que se ve, no lo que protege. -->
<div id="cerradura" class="rx-cerradura" hidden></div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="op-layer"></div>

<script type="module" src="./js/app.js"></script>
